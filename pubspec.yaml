name: openus
description: OPENUS — Your personal AI. A modular Android and Windows assistant.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  # All plugins below declare Android and Windows support. See docs/DEPENDENCIES.md.
  provider: ^6.1.5
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^10.3.4
  path_provider: ^2.1.5
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
