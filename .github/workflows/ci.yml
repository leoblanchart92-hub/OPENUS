name: OPENUS foundations

on:
  push:
    branches: ['arena/57c93823-openus']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openus-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Canonical Dart formatting
        run: dart format lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --reporter expanded
      - name: Preserve verified formatting on the session branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/57c93823-openus'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve Dart formatting and dependency lock [skip ci]'
            git push origin HEAD:arena/57c93823-openus
          fi

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: OPENUS-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test --no-pub test/storage_test.dart
      - run: flutter build windows --release --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: OPENUS-windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7
          if-no-files-found: error
