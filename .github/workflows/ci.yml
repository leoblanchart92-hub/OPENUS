name: OPENUS foundations

on:
  push:
    branches: ['arena/57c93823-openus']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openus-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-pub > analyze.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        run: flutter test --no-pub --reporter expanded > test.log 2>&1
      - name: Publish readable verification results
        if: always()
        run: |
          failed=0
          if [ '${{ steps.analyze.outcome }}' != success ]; then
            python .github/scripts/report_log.py analyze.log --annotate
            failed=1
          else
            python .github/scripts/report_log.py analyze.log
          fi
          if [ '${{ steps.test.outcome }}' != success ]; then
            python .github/scripts/report_log.py test.log --annotate
            failed=1
          else
            python .github/scripts/report_log.py test.log
          fi
          exit "$failed"

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android
        id: build
        continue-on-error: true
        run: flutter build apk --debug --no-pub > android-build.log 2>&1
      - name: Publish build result
        if: always()
        run: |
          if [ '${{ steps.build.outcome }}' != success ]; then
            python .github/scripts/report_log.py android-build.log --annotate
            exit 1
          fi
          python .github/scripts/report_log.py android-build.log
      - uses: actions/upload-artifact@v7
        with:
          name: OPENUS-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test --no-pub test/storage_test.dart
      - name: Build Windows
        id: build
        continue-on-error: true
        shell: bash
        run: flutter build windows --release --no-pub > windows-build.log 2>&1
      - name: Publish build result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.build.outcome }}' -ne 'success') {
            if (Test-Path windows-build.log) {
              $tail = (Get-Content windows-build.log -Tail 80) -join "`n"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows build failure`n$tail" -Encoding utf8
              Write-Host $tail
              $short = $tail
              if ($short.Length -gt 700) { $short = $short.Substring($short.Length - 700) }
              $escaped = ($short -replace '%', '%25') -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Host "::error title=Windows build failure::$escaped"
            }
            exit 1
          }
          if (Test-Path windows-build.log) { Get-Content windows-build.log -Tail 20 }
      - uses: actions/upload-artifact@v7
        with:
          name: OPENUS-windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7
          if-no-files-found: error
