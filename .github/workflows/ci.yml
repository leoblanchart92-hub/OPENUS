name: OPENUS foundations

on:
  push:
    branches: ['arena/57c93823-openus']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openus-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Canonical Dart formatting
        run: dart format lib test
      - name: Preserve formatting and resolved dependency lock on the session branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/57c93823-openus'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve Dart formatting and dependency lock [skip ci]'
            git push origin HEAD:arena/57c93823-openus
          fi
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-pub > analyze.log 2>&1
      - name: Test
        id: test
        continue-on-error: true
        run: flutter test --no-pub --reporter expanded > test.log 2>&1
      - name: Publish readable verification results
        if: always()
        run: |
          for file in analyze.log test.log; do
            if [ -f "$file" ]; then
              echo "## $file" >> "$GITHUB_STEP_SUMMARY"
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              tail -c 45000 "$file" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$file"
            fi
          done
          if [ '${{ steps.analyze.outcome }}' != success ] || [ '${{ steps.test.outcome }}' != success ]; then exit 1; fi

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android
        id: build
        continue-on-error: true
        run: flutter build apk --debug --no-pub > android-build.log 2>&1
      - name: Publish build result
        if: always()
        run: |
          if [ -f android-build.log ]; then
            echo '## Android build' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -c 50000 android-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -150 android-build.log
          fi
          if [ '${{ steps.build.outcome }}' != success ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: OPENUS-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows release build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test --no-pub test/storage_test.dart
      - name: Build Windows
        id: build
        continue-on-error: true
        shell: bash
        run: flutter build windows --release --no-pub > windows-build.log 2>&1
      - name: Publish build result
        if: always()
        shell: bash
        run: |
          if [ -f windows-build.log ]; then
            echo '## Windows build' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -c 50000 windows-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -150 windows-build.log
          fi
          if [ '${{ steps.build.outcome }}' != success ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: OPENUS-windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7
          if-no-files-found: error
